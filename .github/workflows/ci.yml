name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version-file: backend/.python-version
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: scripts/setup.sh
      - name: Check
        run: scripts/check.sh

  # Builds the image once: the browser tests' second build reuses the container check's layers.
  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('frontend/package-lock.json') }}
      # No --with-deps: the runner already has Chrome's libraries, and its apt step took up to minutes.
      - name: Install
        run: npm ci && npx playwright install chromium
      - name: Container check
        run: ../scripts/check_container.sh
      - name: Browser tests against the container
        run: npm run e2e:container
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/

  # The /design pages exist only in development builds; everything else runs against the container.
  # They measure pixel spacing, so they run in this image for consistent fonts.
  design:
    name: design
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version-file: backend/.python-version
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Browser tests of /design
        run: npx playwright test --project design
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report-design
          path: |
            frontend/playwright-report/
            frontend/test-results/
