name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_screenshots:
        description: Make new screenshot baselines and upload them as an artifact
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version-file: backend/.python-version
          enable-cache: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: scripts/setup.sh
      - name: Check
        run: scripts/check.sh

  # Screenshots are made and compared only in this container, since font rendering differs by machine.
  visual:
    name: visual
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Compare screenshots
        if: ${{ !inputs.update_screenshots }}
        run: npm run e2e
      - name: Make screenshots
        if: ${{ inputs.update_screenshots }}
        run: npm run e2e -- --update-snapshots=all
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ inputs.update_screenshots }}
        with:
          name: screenshots
          path: frontend/e2e/__screenshots__/
