[project]
name = "binsight-backend"
version = "0.0.0"
description = "Backend for Binsight, a self-hosted home inventory tracker"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.0",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true

[tool.mypy]
strict = true
